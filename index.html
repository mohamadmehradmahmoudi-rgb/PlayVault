/* PlayVault v5 refinements */
:root{--pv-glow:0 12px 40px #6655ee22} body{font-family:'Vazirmatn',Tahoma,sans-serif;letter-spacing:-.15px} .card{box-shadow:0 5px 18px #0002}.card:hover{box-shadow:var(--pv-glow)}.cover{height:190px}.cover img{transition:transform .5s}.card:hover .cover img{transform:scale(1.035)}.about,.panel,.download-list{overflow:hidden;min-width:0;max-width:100%}.about *,.panel *,.download-list *{max-width:100%;overflow-wrap:anywhere}.modal-box{width:min(480px,calc(100vw - 28px));padding:clamp(18px,4vw,28px)}input[type=file]{max-width:100%;width:100%;display:block}.backup-card{width:100%;max-width:100%;overflow:hidden;display:flex;flex-direction:column;gap:14px}.backup-card button{align-self:flex-start;max-width:100%}.view-tabs{scrollbar-width:thin}.device-chip{font-size:11px;border:1px solid #334155;border-radius:99px;padding:5px 9px;color:#9db5d6}.pro-banner{margin:24px 0;border-radius:22px;padding:26px;background:linear-gradient(135deg,#211044,#101a37 55%,#12344a);border:1px solid #8b5cf644;position:relative;overflow:hidden}.pro-banner:after{content:'✦';position:absolute;left:20px;top:15px;font-size:70px;color:#a78bfa44}.pro-banner h2{background:linear-gradient(90deg,#f0abfc,#a5f3fc);color:transparent;background-clip:text}.pro-banner p{color:#c4b5fd;max-width:700px}.pro-banner .btn{background:linear-gradient(90deg,#d946ef,#7c3aed);color:white}@media(max-width:600px){.top{gap:10px;padding:12px 4%}.brand{width:100%;justify-content:space-between}.top nav{order:2;gap:12px;font-size:13px;padding-bottom:5px}.hero h1{font-size:38px}.cover{height:165px}.grid{grid-template-columns:1fr;gap:15px}.card-body{padding:14px}.filters{display:grid;grid-template-columns:1fr}.filters>*{width:100%;min-width:0}.stats{margin:0 4% 25px;padding:14px}.stats span{font-size:11px}.about{padding:18px}.backup-card{padding:16px!important}.download-item{align-items:flex-start;flex-wrap:wrap}.download-item button{flex-shrink:0}}

/* v9: light theme + price badges */
#themeToggle{white-space:nowrap}
.price-tag{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700;margin:5px 0;background:linear-gradient(135deg,#17223a,#131b2b)}
.price-tag.free{border-color:#2c9c79;color:#65e6b4;background:#10251f}
.price-tag.unknown{color:var(--muted)}
.card .price-tag{margin:8px 0}
body.light{--bg:#f3f6fc;--panel:#ffffff;--panel2:#e8edf7;--line:#d0d8e7;--text:#182236;--muted:#56647b;--purple:#6d46d9;--cyan:#087db0;--pink:#a334bb;background:radial-gradient(ellipse at 70% 0%,#e2eaff 0,transparent 38%),var(--bg);color:var(--text)}
body.light .top{background:#ffffffd9}body.light .detail-toolbar{background:#fffE}body.light .price-tag{background:#e8eef9}body.light .panel,body.light .modal-box,body.light .card{background:var(--panel)}body.light textarea,body.light input,body.light select{background:#fff!important;color:var(--text)!important}
@media(max-width:600px){#themeToggle{font-size:12px;padding:8px}.price-tag{font-size:12px}}

/* PlayVault card polish: cohesive hover, touch feedback, image crop, metadata */
.card{border-radius:20px;box-shadow:0 6px 22px rgba(0,0,0,.16);transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease;background:linear-gradient(180deg,#141d30,#0f1523)}
.card:active{transform:scale(.985)}
.card .cover{height:190px;overflow:hidden;border-radius:0;position:relative}
.card .cover img{transition:transform .35s ease,filter .35s ease;filter:saturate(1.06)}
.card:hover .cover img{transform:scale(1.055);filter:saturate(1.16)}
.card-body{display:flex;flex-direction:column;gap:7px}
.card-body h3{line-height:1.45;min-height:1.45em}
.card-body .tag{align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
.card-actions{margin-top:auto;padding-top:8px}
@media(hover:hover) and (pointer:fine){.card:hover{transform:translateY(-5px);box-shadow:0 16px 35px rgba(95,76,220,.22);border-color:#7564ed}}
@media(hover:none){.card:active{transform:scale(.975);box-shadow:0 8px 24px rgba(95,76,220,.2);border-color:#7564ed}.card .cover img{transform:none}}
.pv-language{display:flex;align-items:center;gap:6px;font-size:12px}.pv-language select{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px;border-radius:10px}.goog-te-gadget{font-size:0!important}.goog-te-gadget select{font-size:12px!important}@media(max-width:800px){.pv-language{order:4}}

/*  visual + responsive connection panel fixes */
#v18connect{background:linear-gradient(145deg,#111b30,#0c1424 65%,#13243a);border:1px solid #354663;border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:0 18px 55px #0004;max-width:1100px;margin:25px auto 35px}
#v18connect h2{font-size:clamp(22px,3vw,30px);margin:0 0 10px}
#v18connect>p:first-of-type{margin-bottom:24px}
#v18connect label{display:block;font-size:14px;font-weight:700;color:#cbd5e1;margin:14px 0}
#v18connect input{display:block;width:100%;min-width:0;margin-top:8px;padding:13px 15px;border-radius:12px;background:#0a1221;color:#f1f5f9;border:1px solid #33445f;outline:none;direction:ltr;text-align:left;font-family:Tahoma,sans-serif;font-size:14px;transition:border .2s,box-shadow .2s}
#v18connect input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf633}
#v18connect button{margin:5px 5px 5px 0;min-height:43px}

#v18connect hr{border:0;border-top:1px solid #334155;margin:24px 0}
#pvOnlineMsg{min-height:24px;padding:10px 12px;border-radius:10px;background:#0a1221;border:1px solid #263852;color:#c4b5fd;overflow-wrap:anywhere}
#v18connect .warning{margin-top:18px;background:#3b2c15;color:#fcd34d;line-height:1.9}
body.light #v18connect{background:linear-gradient(145deg,#fff,#f0f5ff);border-color:#d4dce8;box-shadow:0 15px 40px #64748b18}
body.light #v18connect label{color:#334155}
body.light #v18connect input{background:#fff;color:#182338;border-color:#cbd5e1}
body.light #pvOnlineMsg{background:#f1f5ff;color:#4338ca;border-color:#dbe3f4}
body.light #v18connect .warning{background:#fff7ed;color:#9a3412}
@media(max-width:600px){#v18connect{margin:16px 0 25px;padding:17px;border-radius:18px}#v18connect input{font-size:13px}#v18connect button{width:100%;margin:5px 0}}

/*  visual polish: layered panels, responsive bot layout and resilient cover fallbacks */
.pvbot-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:25px;border-radius:22px;background:linear-gradient(125deg,#211044,#111b36 60%,#12394a);border:1px solid #8b5cf644;overflow:hidden;margin-bottom:20px}.pvbot-kicker{font-size:11px;letter-spacing:2px;color:#67e8f9}.pvbot-hero h2{font-size:clamp(23px,4vw,34px)}.pvbot-hero p{color:#c4b5e9}.pvbot-orb{width:95px;height:95px;flex:0 0 95px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff;background:radial-gradient(circle at 30% 25%,#67e8f9,#8b5cf6 60%,#30145b);box-shadow:0 0 45px #8b5cf655}.pvbot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.pvbot-grid .panel{min-width:0}.pvbot-grid textarea,.pvbot-grid input{width:100%;max-width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);margin-top:7px}.pvbot-result{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:15px;padding:12px;border:1px dashed var(--line);border-radius:12px}.pv-cover-fallback{background:radial-gradient(circle at 30% 20%,#46577c,#171d30);}.cover.has-img .cover-emoji{opacity:0}.cover:not(.has-img) .cover-emoji{opacity:1}@media(max-width:650px){.pvbot-grid{grid-template-columns:1fr}.pvbot-hero{padding:18px}.pvbot-orb{width:68px;height:68px;flex-basis:68px;font-size:22px}.card .cover img{object-position:center;max-width:100%}}


/*  visual system: premium dark surfaces, responsive inbox and accessible focus */
:root{--pv23-accent:#ef4444;--pv23-accent2:#8b5cf6;--pv23-surface:rgba(17,24,39,.82)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn,.mini,.view-tab{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,filter .18s ease}
.btn:hover,.mini:hover,.view-tab:hover{filter:brightness(1.08);box-shadow:0 8px 24px #8b5cf622}
.pv23-dm-layout{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,1.7fr);gap:14px;align-items:start}
.pv23-dm-layout>.panel{min-width:0}
.pv23-dm-layout input{width:100%;min-width:0;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin:8px 0}
.pv23-post-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.pv23-inbox{display:grid;gap:7px;margin-top:12px;max-height:430px;overflow:auto}
.pv23-inbox button,.pv23-user-result{width:100%;text-align:right;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.pv23-inbox button.active{border-color:var(--pv23-accent2);box-shadow:0 0 0 2px #8b5cf622}
.pv23-chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pv23-chat-messages{display:flex;flex-direction:column;gap:9px}
.pv23-message{max-width:min(88%,620px);padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow-wrap:anywhere}
.pv23-message.mine{align-self:flex-start;border-color:#8b5cf655;background:linear-gradient(135deg,#2b1d46,#172033)}
.pv23-message.theirs{align-self:flex-end}
.pv23-message small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.pv23-user-result{display:block;margin-top:7px}
.pv23-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
body.light .pv23-inbox button,body.light .pv23-user-result{background:#f1f5f9;color:#182338}
body.light .pv23-message.mine{background:#f1eafe}
@media(max-width:760px){.pv23-dm-layout{grid-template-columns:1fr}.pv23-inbox{max-height:220px}.pv23-message{max-width:94%}}
@media(prefers-reduced-motion:reduce){.btn,.mini,.view-tab{transition:none}}

/* PlayVault V24.3 · account dashboard inspired by the supplied references */
.pv242-account-hero{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;padding:28px;border:1px solid #6c75a755;border-radius:26px;background:radial-gradient(ellipse at 12% 20%,#8b5cf633,transparent 42%),linear-gradient(125deg,#17233b,#111827 65%,#18243a);box-shadow:0 18px 50px #0003;margin-bottom:26px}
.pv242-orbit{position:absolute;z-index:-1;border:1px dashed #8b5cf655;border-radius:50%;pointer-events:none}
.pv242-orbit-one{width:260px;height:120px;left:-45px;top:12px;transform:rotate(-28deg)}
.pv242-orbit-two{width:210px;height:190px;left:-15px;top:-28px;border-color:#38bdf844;transform:rotate(25deg)}
.pv242-avatar-wrap{position:relative;display:grid;place-items:center;width:112px;height:112px;border-radius:50%;border:2px solid #a78bfa99;background:linear-gradient(145deg,#29385a,#111827);box-shadow:0 0 32px #8b5cf644}

.pv242-membership{background:#23d5ab16;border-color:#23d5ab55;color:#83f0d1}

.pv242-account-stats span{font-size:11px;color:var(--muted)}
.pv242-block-head{display:flex;align-items:center;justify-co
